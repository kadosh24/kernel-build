name: Compilador de Kernel Samsung A20s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Instalar Herramientas de Compilacion
      run: |
        sudo apt-get update -y
        sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev tcl-dev zip wget unzip

    - name: Descargar y Descomprimir Codigo Fuente del Kernel
      run: |
        wget https://github.com -O kernel.zip
        unzip kernel.zip
        mv android_kernel_samsung_a20s-eleven kernel-source
        
    - name: Descargar Compilador Estable (Proton Clang)
      run: |
        wget https://github.com -O toolchain.zip
        unzip toolchain.zip
        mv proton-clang-master toolchain

    - name: Compilar Kernel
      run: |
        cd kernel-source
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="${{ github.workspace }}/toolchain/bin:${PATH}"
        
        # Limpieza previa de compilaciones anteriores
        make O=out clean
        make O=out mrproper
        
        # Configurar y compilar controlando el uso de RAM (-j2)
        make O=out a20s_defconfig
        make O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- -j2

    - name: Subir Archivo Terminado
      uses: actions/upload-artifact@v4
      with:
        name: Kernel_A20s_Android12
        path: kernel-source/out/arch/arm64/boot/Image.gz
