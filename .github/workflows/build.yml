name: Compilador de Kernel Samsung A20s

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Configurar Memoria Extendida SWAP de 12GB
      run: |
        sudo swapon --show
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo free -h

    - name: Instalar Herramientas de Compilacion
      run: |
        sudo apt-get update -y
        sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev tcl-dev zip wget unzip

    - name: Descargar y Descomprimir Codigo Fuente del Kernel
      run: |
        wget https://github.com -O kernel.zip
        unzip kernel.zip
        mv android_kernel_samsung_a20s-eleven kernel-source
        
    - name: Descargar Compilador GCC Ultra Liviano (Google Official)
      run: |
        wget https://googlesource.com -O gcc.tar.gz
        mkdir toolchain
        tar -xf gcc.tar.gz -C toolchain

    - name: Compilar Kernel
      run: |
        cd kernel-source
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=${{ github.workspace }}/toolchain/bin/aarch64-linux-android-
        
        # Limpieza previa profunda
        make O=out clean
        make O=out mrproper
        
        # Cargar configuracion base y compilar de forma ultra estable
        make O=out a20s_defconfig
        make O=out -j2

    - name: Subir Archivo Terminado
      uses: actions/upload-artifact@v4
      with:
        name: Kernel_A20s_Android12
        path: kernel-source/out/arch/arm64/boot/Image.gz
